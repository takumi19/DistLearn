cluster_name: decentr-wan-2node
transport: grpc
overlay_network: tailscale
tls_enabled: false
bootstrap_node_id: node-mac
nodes:
  - id: node-mac
    host: macbook-pro.tailnet.ts.net
    bind_host: 0.0.0.0
    port: 50051
    platform: macos
    neighbors: [node-win]
    weight: 1.0
    resources:
      cpu_cores: 8
      accelerator: mps
      relative_speed: 1.0
  - id: node-win
    host: windows-gpu.tailnet.ts.net
    bind_host: 0.0.0.0
    port: 50051
    platform: windows
    neighbors: [node-mac]
    weight: 1.2
    resources:
      cpu_cores: 16
      accelerator: cuda
      relative_speed: 1.8
