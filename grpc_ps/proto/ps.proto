syntax="proto3";

message TensorChunk {
  bytes data = 1;
  string dtype = 2;
  repeated int64 shape = 3;
  bool is_last = 4;
}

message GetStartTimeReply {
  string timestamp = 1;
}

message GetStartTimeArgs {}

service ParameterServer {
  rpc SyncUpdate(stream TensorChunk) returns (stream TensorChunk) {}
  rpc AsyncUpdate(stream TensorChunk) returns (stream TensorChunk) {}
  rpc GetStartTime(GetStartTimeArgs) returns (GetStartTimeReply) {}
}
