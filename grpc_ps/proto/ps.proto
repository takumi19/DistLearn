syntax="proto3";

message TensorProto {
  bytes data = 1;
  string dtype = 2;
  repeated int64 shape = 3;
}

message UpdateRequest {
  repeated TensorProto gradients = 1;
  int32 rank = 2;
  int32 epoch = 3;
  TensorProto parameter_update = 4;
}

message UpdateResponse {
  repeated TensorProto parameters = 1;
  TensorProto parameter = 2;
}

message TensorChunk {
  bytes data = 1;
  string dtype = 2;
  repeated int64 shape = 3;
  bool is_last = 4;
}

message GetStartTimeReply {
  string timestamp = 1;
}

message GetStartTimeArgs {}

service ParameterServer {
  // rpc AsyncUpdate(UpdateRequest) returns (UpdateResponse) {}
  // rpc SyncUpdate(UpdateRequest) returns (UpdateResponse) {}

  rpc SyncUpdate(stream TensorChunk) returns (stream TensorChunk) {}
  rpc AsyncUpdate(stream TensorChunk) returns (stream TensorChunk) {}

  rpc GetStartTime(GetStartTimeArgs) returns (GetStartTimeReply) {}
}

